<style>

input[type=text]{font:inherit;padding:10px 12px;border-radius:10px;border:2px solid #cfd7e3;width:100%;max-width:340px}

.rrow{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:start;background:#f6f8fb;border:1px solid #e2e7ef;border-radius:12px;padding:10px;margin:8px 0}

.rrow .ctrl{display:flex;flex-wrap:wrap;gap:6px}
.rrow .prev{grid-column:1/3;font-weight:700;color:var(--navy);min-height:1.4em}

.scorebox{text-align:center;padding:20px}

.idcard{background:linear-gradient(135deg,var(--navy),var(--navy3));color:#fff;border-radius:16px;padding:22px;max-width:460px;margin:16px auto;box-shadow:var(--shadow);border:2px solid var(--gold)}

<header>
  <div class="bar">
    <div class="brand">Daily Routines &amp; Time<small>English A1 · Programa CREO · Unimagdalena</small></div>
    <button class="iconbtn" id="homeBtn" title="Volver al inicio" aria-label="Volver a la pantalla de inicio"><span role="img" aria-label="casa">🏠</span></button>
    <button class="iconbtn" id="backBtn" title="Pantalla anterior" aria-label="Ir a la pantalla anterior"><span role="img" aria-label="flecha izquierda">◀</span></button>
    <button class="iconbtn" id="fwdBtn" title="Pantalla siguiente" aria-label="Ir a la pantalla siguiente (solo pantallas ya visitadas)"><span role="img" aria-label="flecha derecha">▶</span></button>
    <button class="iconbtn" id="slowBtn" aria-pressed="false" title="Audio lento" aria-label="Activar o desactivar audio lento"><span role="img" aria-label="tortuga">🐢</span></button>
    <button class="iconbtn" id="muteBtn" aria-pressed="false" title="Silenciar sonidos" aria-label="Silenciar o activar sonidos"><span role="img" aria-label="altavoz" id="muteIco">🔊</span></button>
  </div>
  <div class="progress" aria-hidden="true"><div id="pbar"></div></div>
</header>
<main id="app" aria-live="polite"></main>
<footer>OVA elaborado por Juan S. Llinás · Universidad del Magdalena · Licencia CC BY-NC-SA 4.0<br>Tu progreso se guarda en este navegador. Tu evidencia de nota es la imagen PNG que descargas al final.</footer>

<script>
"use strict";
/* ================= STATE ================= */
const KEY="ova_rutinas_v2";
let S={name:"",screen:0,maxScreen:0,steps:{},evalDone:false,evalScore:0,evalParts:[0,0,0,0,0],routine:[],slow:false,mute:false};
try{const raw=localStorage.getItem(KEY);if(raw){S=Object.assign(S,JSON.parse(raw));}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function done(k){S.steps[k]=true;save();}
function isDone(k){return !!S.steps[k];}

/* ================= AUDIO ================= */
let AC=null;
function actx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,t,dur,type){const a=actx();if(!a||S.mute)return;const o=a.createOscillator(),g=a.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(.16,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+dur);o.connect(g).connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+dur);}
function sOK(){tone(660,0,.12);tone(880,.12,.18);}
function sBAD(){tone(220,0,.22,"square");}
function sWIN(){[523,659,784,1046].forEach((f,i)=>tone(f,i*.13,.22));}
/* Voces: v = Valentina (aguda), d = Daniel (grave), n = neutra */
function speak(txt,who){
  if(S.mute)return;
  try{
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(txt);
    u.lang="en-US";u.rate=S.slow?0.6:0.92;
    u.pitch=who==="v"?1.3:who==="d"?0.75:1;
    const v=window.speechSynthesis.getVoices().find(x=>x.lang&&x.lang.startsWith("en"));
    if(v)u.voice=v;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ================= HELPERS ================= */
const app=document.getElementById("app");
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function say(t,who,label){return `<button class="saybtn" data-say="${esc(t)}" data-who="${who||"n"}" aria-label="Escuchar en inglés"><span role="img" aria-label="audio">🔊</span> ${label||"Escuchar"}</button>`;}
function bindSay(root){root.querySelectorAll("[data-say]").forEach(b=>b.addEventListener("click",()=>speak(b.dataset.say,b.dataset.who)));}
function fb(el,ok,msgOK,msgBad){el.className="fb "+(ok?"ok":"bad");el.textContent=ok?(msgOK||"¡Correcto! Well done."):(msgBad||"Todavía no. Revisa e intenta de nuevo.");}
function gate(btnId,cond){const b=document.getElementById(btnId);if(b)b.disabled=!cond;}
function goto(n){S.screen=Math.max(0,Math.min(SCREENS.length-1,n));S.maxScreen=Math.max(S.maxScreen||0,S.screen);save();render();window.scrollTo(0,0);}
function navRow(prevOk,nextLabel){
  return `<div class="navrow">
    <button class="btn ghost" id="prevBtn" ${prevOk?"":"style='visibility:hidden'"}>&larr; Atrás</button>
    <button class="btn gold" id="nextBtn" disabled>${nextLabel||"Continuar"} &rarr;</button>
  </div>`;
}
function bindNav(){
  const p=document.getElementById("prevBtn"),n=document.getElementById("nextBtn");
  if(p)p.addEventListener("click",()=>goto(S.screen-1));
  if(n)n.addEventListener("click",()=>goto(S.screen+1));
}
function bubble(who,html,audioTxt){
  const w=who==="v"?`<span role="img" aria-label="mujer líder de turismo">👩🏽‍✈️</span><small>Valentina</small>`
        :who==="d"?`<span role="img" aria-label="hombre guía nuevo">🧑🏽‍🦱</span><small>Daniel</small>`
        :who==="t"?`<span role="img" aria-label="turista">🧳</span><small>Turista</small>`
        :`<span role="img" aria-label="tú">🙋</span><small>Tú</small>`;
  return `<div class="dialog"><span class="who">${w}</span>
    <div class="bubble ${who==="u"?"me":""}">${html}${audioTxt?" "+say(audioTxt,who==="t"?"n":who):""}</div></div>`;
}

/* Motor genérico: serie de opción múltiple */
function mcDrill(cfg){
  let idx=isDone(cfg.key)?cfg.items.length:0;
  function draw(){
    if(idx>=cfg.items.length){
      app.innerHTML=`<div class="card"><span class="eyebrow">${cfg.eyebrow}</span>
      <h1>${cfg.doneTitle}</h1>
      <div class="fb ok" style="display:block">${cfg.doneMsg}</div>
      ${cfg.doneExtra||""}
      ${navRow(true,cfg.nextLabel)}</div>`;
      bindSay(app);bindNav();gate("nextBtn",true);
      if(cfg.nextOverride){
        const n=document.getElementById("nextBtn");
        const c=n.cloneNode(true);c.disabled=false;
        n.parentNode.replaceChild(c,n);
        c.addEventListener("click",cfg.nextOverride);
      }
      return;
    }
    const it=cfg.items[idx];
    app.innerHTML=`
    <div class="card">
      <span class="eyebrow">${cfg.eyebrow} · ${idx+1} de ${cfg.items.length}</span>
      <h1>${cfg.title}</h1>
      ${cfg.intro||""}
      ${it.pre||""}
      ${it.stem?`<p style="font-size:1.25rem"><span class="en">${it.stem}</span></p>`:""}
      ${shuffle(it.opts.map((o,i)=>({o,i}))).map(x=>`<button class="opt" data-i="${x.i}">${esc(x.o)}</button>`).join("")}
      <div class="fb" id="dfb" aria-live="polite"></div>
      <div class="navrow"><button class="btn ghost" id="prevBtn">&larr; Atrás</button>
      <button class="btn gold" id="contBtn" disabled>Siguiente &rarr;</button></div>
    </div>`;
    bindSay(app);
    document.getElementById("prevBtn").addEventListener("click",()=>goto(S.screen-1));
    const f=document.getElementById("dfb");
    app.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
      if(Number(b.dataset.i)===it.ok){
        app.querySelectorAll(".opt").forEach(x=>x.disabled=true);
        b.classList.add("right");sOK();
        if(it.sayOK)speak(it.sayOK,it.who||"n");
        fb(f,true,"¡Correcto! "+(it.why||""));
        document.getElementById("contBtn").disabled=false;
      }else{b.classList.add("wrong");b.disabled=true;sBAD();fb(f,false,"",it.wrongMsg||"Intenta otra opción.");}
    }));
    document.getElementById("contBtn").addEventListener("click",()=>{idx++;if(idx>=cfg.items.length)done(cfg.key);draw();window.scrollTo(0,0);});
  }
  draw();
}

/* Motor genérico: matching táctil de parejas */
function matchDrill(cfg){
  const left=shuffle(cfg.pairs.map(p=>p.l));
  const right=shuffle(cfg.pairs.map(p=>p.r));
  let selL=null,selR=null,matched=0;
  app.innerHTML=`
  <div class="card">
    <span class="eyebrow">${cfg.eyebrow}</span>
    <h1>${cfg.title}</h1>
    <p class="es">${cfg.desc}</p>
    <div class="matchcols">
      <div>${left.map((t,i)=>`<button class="mbtn" data-side="L" data-val="${esc(t.v)}">${t.html}</button>`).join("")}</div>
      <div>${right.map((t,i)=>`<button class="mbtn" data-side="R" data-val="${esc(t.v)}">${t.html}</button>`).join("")}</div>
    </div>
    <div class="fb" id="mfb" aria-live="polite"></div>
    ${navRow(true,cfg.nextLabel)}
  </div>`;
  bindNav();
  if(isDone(cfg.key))gate("nextBtn",true);
  const f=document.getElementById("mfb");
  app.querySelectorAll(".mbtn").forEach(b=>b.addEventListener("click",()=>{
    if(b.classList.contains("done"))return;
    if(b.dataset.side==="L"){if(selL)selL.classList.remove("sel");selL=b;b.classList.add("sel");}
    else{if(selR)selR.classList.remove("sel");selR=b;b.classList.add("sel");}
    if(selL&&selR){
      const okPair=cfg.pairs.some(p=>p.l.v===selL.dataset.val&&p.r.v===selR.dataset.val);
      if(okPair){
        selL.classList.remove("sel");selR.classList.remove("sel");
        selL.classList.add("done");selR.classList.add("done");
        if(cfg.sayPair)speak(cfg.sayPair(selL.dataset.val,selR.dataset.val));
        sOK();matched++;
        if(matched===cfg.pairs.length){fb(f,true,cfg.doneMsg);done(cfg.key);gate("nextBtn",true);}
      }else{
        sBAD();fb(f,false,"","Esa pareja no coincide. Intenta otra combinación.");
        selL.classList.remove("sel");selR.classList.remove("sel");selL=null;selR=null;return;
      }
      selL=null;selR=null;
    }
  }));
}

/* ================= DATA ================= */
const VOCAB=[
 {en:"wake up",es:"despertarse",emo:"⏰",lab:"reloj despertador",me:"I wake up"},

function clockSVG(h,m){
  const cx=70,cy=70,r=64;
  const ah=((h%12)+m/60)*30-90, am=m*6-90;
  const rad=d=>d*Math.PI/180;
  const hx=cx+34*Math.cos(rad(ah)),hy=cy+34*Math.sin(rad(ah));
  const mx=cx+50*Math.cos(rad(am)),my=cy+50*Math.sin(rad(am));
  let marks="";
  for(let i=0;i<12;i++){const a=rad(i*30-90);marks+=`<circle cx="${cx+56*Math.cos(a)}" cy="${cy+56*Math.sin(a)}" r="2.4" fill="#d9a441"/>`;}
  return `<svg viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="Reloj marcando las ${h} y ${m} minutos">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="#10294a" stroke="#d9a441" stroke-width="4"/>${marks}
    <line x1="${cx}" y1="${cy}" x2="${hx}" y2="${hy}" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <line x1="${cx}" y1="${cy}" x2="${mx}" y2="${my}" stroke="#f2c979" stroke-width="4" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="5" fill="#d9a441"/>
  </svg>`;
}

function s5(){

      const q=qs[qi],f=document.getElementById("gfb");
      app.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
        if(Number(b.dataset.i)===q.ok){

        }else{b.classList.add("wrong");b.disabled=true;sBAD();fb(f,false,"","Vuelve a leer los textos y prueba otra opción.");}
      }));
    }
  }
  draw();
}

   {pre:`<p class="es">Transforma al negativo:</p><p style="font-size:1.2rem"><span class="en">Daniel gets up early on Saturdays.</span></p>`,opts:["Daniel doesn't gets up early on Saturdays.","Daniel don't get up early on Saturdays.","Daniel doesn't get up early on Saturdays."],ok:2,sayOK:"Daniel doesn't get up early on Saturdays.",why:"doesn't + forma base: get, sin -s."}
  ];
  const writeItems=[
   {aff:"We have lunch at the office.",say:"We don't have lunch at the office.",ok:["we dont have lunch at the office","we do not have lunch at the office"],hint:"we → don't + verbo base"},
   {aff:"She watches TV in the morning.",say:"She doesn't watch TV in the morning.",ok:["she doesnt watch tv in the morning","she does not watch tv in the morning"],hint:"she → doesn't, y el verbo pierde la -s"},
   {aff:"I get up early on Sundays.",say:"I don't get up early on Sundays.",ok:["i dont get up early on sundays","i do not get up early on sundays"],hint:"I → don't + verbo base"}
  ];
  const norm=t=>t.toLowerCase().replace(/['’.!]/g,"").replace(/\s+/g," ").trim();

        app.innerHTML=`<div class="card"><span class="eyebrow">Capítulo 4 · Escritura</span>

        <div class="fb ok" style="display:block">Seleccionaste y también escribiste tus propias oraciones negativas. don't / doesn't + verbo base.</div>
        ${navRow(true,"Llegó la hora de las preguntas")}</div>`;
        bindNav();gate("nextBtn",true);return;
      }
      const it=writeItems[wi];
      app.innerHTML=`
      <div class="card">
        <span class="eyebrow">Capítulo 4 · Escritura · ${wi+1} de ${writeItems.length}</span>
        <h1>Ahora escríbelo tú</h1>
        <p class="es">Escribe la oración completa en negativo. Pista: ${esc(it.hint)}.</p>
        <p style="font-size:1.2rem"><span class="en">${esc(it.aff)}</span></p>
        <input type="text" id="wInp" autocomplete="off" spellcheck="false" placeholder="Escribe la oración en negativo…" aria-label="Escribe la oración en negativo" style="max-width:100%">
        <div style="margin-top:10px"><button class="btn" id="wCheck">Comprobar</button></div>
        <div class="fb" id="wfb" aria-live="polite"></div>
        <div class="navrow"><button class="btn ghost" id="prevBtn">&larr; Atrás</button>
        <button class="btn gold" id="contBtn" disabled>Siguiente &rarr;</button></div>
      </div>`;
      document.getElementById("prevBtn").addEventListener("click",()=>goto(S.screen-1));
      const f=document.getElementById("wfb"),inp=document.getElementById("wInp");
      document.getElementById("wCheck").addEventListener("click",()=>{
        if(it.ok.includes(norm(inp.value))){
          sOK();speak(it.say);fb(f,true,"¡Perfecto! "+it.say);
          inp.disabled=true;document.getElementById("wCheck").disabled=true;
          document.getElementById("contBtn").disabled=false;
        }else{sBAD();fb(f,false,"","Todavía no. Revisa: "+it.hint+". Cuida el orden y la ortografía.");}
      });
      inp.addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("wCheck").click();});
      document.getElementById("contBtn").addEventListener("click",()=>{wi++;if(wi>=writeItems.length)done("n3");wdraw();window.scrollTo(0,0);});
    }
    wdraw();
  }
  if(isDone("n2")){writePhase();return;}
  if(isDone("n1")){
    mcDrill({
      key:"n2",eyebrow:"Capítulo 4 · Transformación",title:"De afirmativo a negativo",
      items:items,
      doneTitle:"¡Buena selección!",doneMsg:"Ahora sube el reto: vas a escribir las oraciones tú mismo.",nextLabel:"Escribir mis oraciones",
      nextOverride:()=>{writePhase();window.scrollTo(0,0);}
    });
    return;
  }
  {
    app.innerHTML=`
    <div class="card">
      <span class="eyebrow">Capítulo 4 · Gramática</span>

          <p class="en">I work on Mondays.</p>
          <p class="en">Daniel works on Saturdays.</p></div>

          <p class="en">I <strong>don't work</strong> on Sundays. ${say("I don't work on Sundays.","v")}</p>
          <p class="en">Daniel <strong>doesn't work</strong> at night. ${say("Daniel doesn't work at night.","v")}</p></div>

function s11(){
  const sentences=[

   {words:["What","time","do","you","start","work?"],say:"What time do you start work?",hint:"Pide la hora exacta."},
   {words:["When","do","you","have","lunch?"],say:"When do you have lunch?",hint:"Pide el momento del día."},
   {words:["What","time","do","you","go","to","bed?"],say:"What time do you go to bed?",hint:"Pide la hora exacta."}
  ];
  let si=isDone("q4")?sentences.length:0;
  function draw(){
    if(si>=sentences.length){
      app.innerHTML=`<div class="card"><span class="eyebrow">Capítulo 5 · Práctica 3</span>
      <h1>¡Ya construyes preguntas!</h1>
      <div class="fb ok" style="display:block">Recuerda el orden fijo: (palabra de pregunta) + do + you + verbo base.</div>
      ${navRow(true,"Detectar errores")}</div>`;
      bindNav();gate("nextBtn",true);return;
    }
    const s=sentences[si];
    let built=[];
    const bank=shuffle(s.words.map((w,i)=>({w,i})));
    function paint(){
      const bEl=document.getElementById("builder"),kEl=document.getElementById("bank");
      bEl.innerHTML=built.length?built.map((t,j)=>`<button class="chip inb" data-j="${j}" aria-label="Quitar palabra ${esc(t.w)}">${esc(t.w)}</button>`).join(""):`<span class="es">Toca las palabras en orden…</span>`;
      kEl.innerHTML=bank.filter(t=>!built.includes(t)).map(t=>`<button class="chip" data-i="${t.i}" aria-label="Agregar palabra ${esc(t.w)}">${esc(t.w)}</button>`).join("");
      bEl.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{built.splice(Number(c.dataset.j),1);paint();}));
      kEl.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{built.push(bank.find(t=>t.i===Number(c.dataset.i)));paint();}));
      document.getElementById("checkBtn").disabled=built.length!==s.words.length;
    }
    app.innerHTML=`
    <div class="card">
      <span class="eyebrow">Capítulo 5 · Práctica 3 · ${si+1} de ${sentences.length}</span>
      <h1>Ordena la pregunta</h1>
      <p class="es">${esc(s.hint)} Toca las palabras en el orden correcto. Toca una palabra del recuadro para quitarla.</p>
      <div class="builder" id="builder"></div>
      <div class="bank" id="bank"></div>
      <button class="btn" id="checkBtn" disabled>Comprobar</button>
      <div class="fb" id="qfb" aria-live="polite"></div>
      <div class="navrow"><span></span><button class="btn gold" id="contBtn" disabled>Siguiente &rarr;</button></div>
    </div>`;
    paint();
    const f=document.getElementById("qfb");
    document.getElementById("checkBtn").addEventListener("click",()=>{
      const ans=built.map(t=>t.w).join(" ");
      if(ans===s.words.join(" ")){
        sOK();speak(s.say,"v");fb(f,true,"¡Perfecto! "+s.say);
        document.getElementById("contBtn").disabled=false;
        document.getElementById("checkBtn").disabled=true;
      }else{sBAD();fb(f,false,"","Ese orden no es correcto. Recuerda: (palabra de pregunta) + do + you + verbo.");}
    });
    document.getElementById("contBtn").addEventListener("click",()=>{si++;if(si>=sentences.length)done("q4");draw();window.scrollTo(0,0);});
  }
  draw();
}

/* 17 · Ruleta de práctica oral */
function s17(){
  const pool=[
   {q:"What time do you get up?",model:"I get up at 6:00 a.m."},
   {q:"Do you have breakfast at home?",model:"Yes, I do. / No, I don't."},
   {q:"What time do you go to the university?",model:"I go to the university at 8:00."},
   {q:"When do you study English?",model:"I study English in the evening."},
   {q:"Do you work on weekends?",model:"Yes, I do. / No, I don't."},
   {q:"What time do you go to bed?",model:"I go to bed at 10:30 p.m."}
  ];
  const NEED=4;
  let doneRounds=isDone("ru1")?NEED:0;
  let bag=[];
  function nextQ(){if(!bag.length)bag=shuffle(pool.map((_,i)=>i));return pool[bag.shift()];}
  let current=null,spin=0;
  function draw(){
    app.innerHTML=`
    <div class="card" style="text-align:center">
      <span class="eyebrow">Capítulo 10 · Práctica oral</span>
      <h1>La ruleta de preguntas</h1>
      <p class="es">Gira la ruleta. Escucha la pregunta y <strong>respóndela en voz alta</strong> con tu propia información. Luego compara con la respuesta modelo y evalúate con honestidad. Completa ${NEED} rondas.</p>
      <div class="rounds" aria-label="Rondas completadas: ${doneRounds} de ${NEED}">${Array.from({length:NEED},(_,i)=>`<span class="${i<doneRounds?"did":""}"></span>`).join("")}</div>
      <div><span class="wheel" id="wheel" role="img" aria-label="ruleta">🎡</span></div>
      <button class="btn gold" id="spinBtn" ${doneRounds>=NEED?"disabled":""}>Girar la ruleta</button>
      <div id="qzone"></div>
      ${navRow(true,"Construir mis 8 oraciones")}
    </div>`;
    bindNav();gate("nextBtn",doneRounds>=NEED);
    document.getElementById("spinBtn").addEventListener("click",()=>{
      spin+=720+Math.floor(Math.random()*360);
      document.getElementById("wheel").style.transform="rotate("+spin+"deg)";
      current=nextQ();
      setTimeout(()=>{
        speak(current.q,"v");
        document.getElementById("qzone").innerHTML=`
        <div class="qcard">${esc(current.q)}<div>${say(current.q,"v","Escuchar de nuevo")}</div></div>
        <p class="es"><strong>Respóndela en voz alta, con tu información real.</strong></p>
        <button class="btn" id="revealBtn">Ver respuesta modelo</button>
        <div id="modelZone"></div>`;
        bindSay(document.getElementById("qzone"));
        document.getElementById("revealBtn").addEventListener("click",()=>{
          document.getElementById("modelZone").innerHTML=`
          <div class="note" style="text-align:left"><strong>Modelo:</strong> <span class="en">${esc(current.model)}</span> ${say(current.model,"d")}<br><span class="es">Tu respuesta puede tener otra hora u otro dato: lo importante es la estructura.</span></div>
          <p class="es">¿Cómo te fue?</p>
          <button class="btn gold" id="selfOK">✔ Lo dije bien</button>
          <button class="btn ghost" id="selfNo">Necesito repetirla</button>`;
          bindSay(document.getElementById("modelZone"));
          document.getElementById("selfOK").addEventListener("click",()=>{doneRounds++;sOK();if(doneRounds>=NEED){done("ru1");sWIN();}draw();window.scrollTo(0,0);});
          document.getElementById("selfNo").addEventListener("click",()=>{speak(current.q,"v");document.getElementById("modelZone").querySelectorAll(".btn").forEach(b=>b.blur());});
        },{once:true});
      },700);
    });
  }
  draw();
}

/* 18 · Construye tu rutina: 8 oraciones libres (tarea) */
function s18(){
  if(!Array.isArray(S.routine)||S.routine.length!==8||S.routine.some(r=>typeof r!=="string")){S.routine=Array(8).fill("");}
  const okLine=t=>{t=t.trim();return /^i\s+\S+/i.test(t)&&t.split(/\s+/).length>=4;};
  const allOK=()=>S.routine.every(okLine);
  const clean=t=>t.trim().replace(/\s+/g," ");
  function draw(){
    app.innerHTML=`
    <div class="card">
      <span class="eyebrow">Capítulo 11 · Tu misión</span>
      <h1>Escribe tu rutina en 8 oraciones</h1>
      ${bubble("v",`<span class="en">Now it's your turn! Tell me about YOUR day in 8 sentences. Use YOUR activities and YOUR real times!</span>`,"Now it's your turn! Tell me about your day in eight sentences. Use your activities and your real times!")}
      <p class="es">Escribe <strong>8 oraciones diferentes</strong> sobre tu propio día, en orden cronológico. Son tuyas: puedes usar cualquier actividad, no solo las del OVA.</p>
      <div class="note"><span role="img" aria-label="idea">💡</span> <strong>Pistas para armar cada oración:</strong><br>
      Estructura: <span class="en">I + verbo + at + hora</span> → <span class="en">I wake up at 6:00 a.m.</span><br>
      Ideas del OVA: <span class="en">wake up, get up, take a shower, have breakfast, go to work, have lunch, go to bed…</span><br>
      Ideas libres: <span class="en">check my phone, study English, play video games, go to the gym, watch TV, listen to music, walk my dog, cook dinner…</span><br>
      También puedes usar momentos: <span class="en">in the morning, in the afternoon, at night, on weekends</span>.</div>
      ${S.routine.map((r,i)=>`
      <div class="rrow">
        <div class="num">${i+1}</div>
        <div class="ctrl" style="width:100%">
          <input type="text" data-r="${i}" value="${esc(r)}" autocomplete="off" spellcheck="false" placeholder="I ..." aria-label="Oración ${i+1} de tu rutina" style="max-width:100%;flex:1">
        </div>
        <div class="prev" id="st${i}"></div>
      </div>`).join("")}
      <div class="fb" id="rfb" aria-live="polite"></div>
      <div id="finalText"></div>
      <div style="margin-top:10px">
        <button class="btn" id="hearBtn" disabled><span role="img" aria-label="audio">🔊</span> Escuchar mis oraciones</button>
        <button class="btn gold" id="copyBtn" disabled>Copiar mis 8 oraciones</button>
      </div>
      <div class="note hw"><span role="img" aria-label="cuaderno">📝</span> <strong>Tarea para la próxima clase:</strong> copia estas 8 oraciones <strong>a mano en tu cuaderno</strong> y <strong>practícalas en voz alta</strong> varias veces (usa el botón de audio como modelo). Debes llevarlas <strong>escritas y practicadas</strong> a clase: las vamos a usar en una actividad de preguntas en parejas.</div>
      ${navRow(true,"Ir a la evaluación final")}
    </div>`;
    bindSay(app);bindNav();
    const f=document.getElementById("rfb");
    function refresh(){
      S.routine.forEach((r,i)=>{
        const st=document.getElementById("st"+i);
        if(!r.trim()){st.innerHTML="";}
        else if(okLine(r)){st.innerHTML=`<span style="color:var(--ok)">✔ Oración ${i+1} lista</span>`;}
        else{st.innerHTML=`<span class="es" style="color:var(--bad)">Empieza con "I" y escribe la oración completa (mínimo 4 palabras).</span>`;}
      });
      const ok=allOK();
      gate("nextBtn",ok);gate("hearBtn",ok);gate("copyBtn",ok);
      if(ok){
        fb(f,true,"¡Tus 8 oraciones están listas! Este es tu texto:");
        document.getElementById("finalText").innerHTML=`<div class="mytext">${S.routine.map((r,i)=>(i+1)+". "+esc(clean(r))).join("<br>")}</div>`;
        done("rt1");
      }else{f.className="fb";document.getElementById("finalText").innerHTML="";}
    }
    app.querySelectorAll(".rrow input").forEach(inp=>inp.addEventListener("input",()=>{
      S.routine[Number(inp.dataset.r)]=inp.value;save();refresh();
    }));
    document.getElementById("hearBtn").addEventListener("click",()=>{
      speak(S.routine.map(clean).join(". ").replace(/a\.m\./gi,"a m").replace(/p\.m\./gi,"p m"));
    });
    document.getElementById("copyBtn").addEventListener("click",()=>{
      const txt="Mi rutina diaria · "+S.name+"\n"+S.routine.map((r,i)=>(i+1)+". "+clean(r)).join("\n")+"\nTarea: escribir a mano y practicar en voz alta para la próxima clase.";
      try{
        navigator.clipboard.writeText(txt).then(()=>{fb(f,true,"¡Copiado! Pégalo donde quieras, pero recuerda: la tarea es escribirlo a mano.");sOK();});
      }catch(e){
        const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();
        try{document.execCommand("copy");fb(f,true,"¡Copiado! Pégalo donde quieras, pero recuerda: la tarea es escribirlo a mano.");}catch(e2){}
        document.body.removeChild(ta);
      }
    });
    refresh();
  }
  draw();
}

const EVAL_MAX=[8,8,8,8,18];

function s19(){
  if(S.evalDone){
    app.innerHTML=`<div class="card"><span class="eyebrow">Evaluación final</span>

    <p>Tu puntaje quedó registrado: <strong>${S.evalScore} / 50</strong>.</p>

    bindNav();gate("nextBtn",true);return;
  }
  const parts=["p1","p2","p3","p4","p5"];
  let html=`<div class="card"><span class="eyebrow">Evaluación final · 50 puntos</span>
  <h1>La prueba de Caribe Vivo, ${esc(S.name.split(" ")[0]||"estudiante")}</h1>

      </div>`;
    });
    html+=`</div>`;
  });

}

const SCREENS=[s0,s1,s2,s3,s4,s5,s6,s7,s8,s9,s10,s11,s12,s13,s14,s15,s16,s17,s18,s19,s20];
const homeBtn=document.getElementById("homeBtn"),backBtn=document.getElementById("backBtn"),fwdBtn=document.getElementById("fwdBtn");
homeBtn.addEventListener("click",()=>goto(0));
backBtn.addEventListener("click",()=>goto(S.screen-1));
fwdBtn.addEventListener("click",()=>{if(S.screen<(S.maxScreen||0))goto(S.screen+1);});
function render(){
  S.maxScreen=Math.max(S.maxScreen||0,S.screen);
  document.getElementById("pbar").style.width=Math.round(S.screen/(SCREENS.length-1)*100)+"%";
  backBtn.disabled=S.screen<=0;
  fwdBtn.disabled=S.screen>=(S.maxScreen||0);
  homeBtn.disabled=S.screen===0;
  SCREENS[S.screen]();
}

/* Controles de la barra superior */
const slowBtn=document.getElementById("slowBtn"),muteBtn=document.getElementById("muteBtn");
function paintCtl(){
  slowBtn.setAttribute("aria-pressed",S.slow?"true":"false");
  muteBtn.setAttribute("aria-pressed",S.mute?"true":"false");
  document.getElementById("muteIco").textContent=S.mute?"🔇":"🔊";
}
slowBtn.addEventListener("click",()=>{S.slow=!S.slow;save();paintCtl();});
muteBtn.addEventListener("click",()=>{S.mute=!S.mute;save();paintCtl();if(S.mute)try{window.speechSynthesis.cancel();}catch(e){}});
paintCtl();
render();
</script>
